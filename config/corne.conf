# Display with nice!view
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Bluetooth transmit power: +8 dBm, the maximum of the nRF52840 (default: 0 dBm).
# Better range through the keyboard case, for a small battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Use only the 1 Mbit/s Bluetooth PHY. It has better range than 2 Mbit/s, and it
# fixes pairing and connection problems with some Windows (Realtek, Intel) and
# older Intel Mac (Broadcom) Bluetooth chips. See ZMK docs: connection issues.
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=16

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
